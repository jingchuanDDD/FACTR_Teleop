urdf: franka_exo/robot.urdf

dynamixel:
  port: COM21
  baudrate: 57600
  read_retries: 3
  retry_delay: 0.01

controller:
  frequency: 100.0
  max_current_raw: 180
  current_deadband_raw: [0, 0, 12, 0, 0, 0, 0]
  ramp_sec: 3.0
  duration: 0.0
  torque_sign: 1.0
  log_interval: 0.5

  gravity_comp:
    enable: true
    gain: 0.35
    joint_gain: [1, 1, 1, 1, 1, 3, 1]

  friction_comp: #记录抖的现象
    enable: true
    static:
      enable: true
      enable_speed: 0.1 #factr 0.9
      gain: 0.3 #factr 0.6
      joint_gain: [1, 1.0, 0, 0.8, 1, 3.0, 1]
      min_torque: [0, 0.15, 0, 0, 0, 0.01, 0]
      max_torque: [0, 0.25, 0, 0, 0, 0.03, 0]
    kinetic:
      enable: true
      velocity_deadband: 0.05
      coulomb: [0, 0.15, 0, 0.02, 0, 0.05, 0]
      viscous: [0, 0.08, 0, 0.01, 0, 0.01, 0]
